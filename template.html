<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Match Day Board</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#16181d; --dim:#6b7280; --border:#e5e7eb;
    --accent:#2563eb; --accent-dim:#dbeafe; --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2; --amber:#d97706; --amber-bg:#fef3c7;
    --star:#f59e0b; --chip-bg:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
    --mcfc-blue:#6cabdd; /* Man City sky blue -- fixed, not redefined by either theme */
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --dim:#9aa1ac; --border:#2a2e37;
      --accent:#5b9bff; --accent-dim:#1c2b47; --green:#4ade80; --green-bg:#0f2d1c;
      --red:#f87171; --red-bg:#3a1414; --amber:#fbbf24; --amber-bg:#3a2c0d;
      --star:#fbbf24; --chip-bg:#232732; --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 8px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.4; padding-bottom:70px;
  }
  a{color:var(--accent);}
  header.top{
    position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--border);
    padding:10px 14px 0 14px;
  }
  header.top h1{font-size:17px; margin:2px 0 2px 0; font-weight:700;}
  header.top .meta{font-size:11px; color:var(--dim); margin-bottom:8px;}
  nav.tabs{display:flex; gap:4px;}
  nav.tabs button{
    flex:1; background:none; border:none; padding:10px 4px; font-size:13.5px; font-weight:600;
    color:var(--dim); border-bottom:2px solid transparent; cursor:pointer;
  }
  nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
  main{padding:12px 12px 24px 12px; max-width:640px; margin:0 auto;}
  section.tab{display:none;}
  section.tab.active{display:block;}

  /* filter bar */
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .filters select, .filters input[type=search]{
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:7px 8px; font-size:13px; flex:1 1 auto; min-width:90px;
  }
  .filters .dropdown-btn{
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:13px; cursor:pointer; flex:1 1 auto; min-width:110px; text-align:left;
    position:relative;
  }
  .filters .dropdown-btn .count{color:var(--accent); font-weight:700;}
  .filters input[type=search]{flex:1 1 100%;}
  .dropdown-panel{
    display:none; position:fixed; left:12px; right:12px; z-index:50; background:var(--card);
    border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:60vh;
    overflow:auto; padding:10px;
  }
  .dropdown-panel.open{display:block;}
  .dropdown-panel .search{width:100%; margin-bottom:8px; padding:7px 8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
  .dropdown-panel .actions{display:flex; gap:8px; margin-bottom:8px;}
  .dropdown-panel .actions button{
    flex:1; padding:6px; border-radius:8px; border:1px solid var(--border); background:var(--chip-bg);
    color:var(--text); font-size:12.5px; cursor:pointer;
  }
  .dropdown-panel label{display:flex; align-items:center; gap:8px; padding:5px 2px; font-size:13.5px; cursor:pointer;}
  .dropdown-panel .backdrop-close{display:block; width:100%; margin-top:6px; padding:8px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer;}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40;}
  .scrim.open{display:block;}

  /* badges */
  .badge{
    width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:#fff; flex:none; overflow:hidden; background-size:cover; background-position:center;
    vertical-align:middle;
  }
  .badge img{width:100%; height:100%; object-fit:cover; display:block;}
  .badge.sm{width:18px; height:18px; font-size:8.5px;}
  .badge.lg{width:34px; height:34px; font-size:13px;}

  /* fixture card */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .card .summary{padding:11px 13px; cursor:pointer;}
  .card .league-row{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); margin-bottom:7px;}
  .card .league-row .time{margin-left:auto; font-weight:600; color:var(--text);}
  .top5-chip{
    background:var(--mcfc-blue); color:#ffffff; font-weight:800; font-size:10px; padding:1px 6px; border-radius:20px; margin-left:6px;
  }
  .matchup{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .matchup .team{display:flex; align-items:center; gap:7px; flex:1; min-width:0;}
  .matchup .team span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; font-size:14px;}
  .matchup .vs{color:var(--dim); font-size:11px; flex:none;}
  .bb-line{
    display:flex; align-items:center; gap:8px; font-size:12.5px; padding:7px 9px; border-radius:9px;
    background:var(--accent-dim); color:var(--text);
  }
  .bb-line .stars{color:var(--star); font-weight:700; white-space:nowrap;}
  .bb-line.pass{background:var(--chip-bg); color:var(--dim);}

  /* expanded */
  .expand{border-top:1px solid var(--border); padding:12px 13px 14px 13px; display:none;}
  .expand.open{display:block;}
  .snapshot-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .snapshot-col h4{font-size:12px; margin:0 0 6px 0; display:flex; align-items:center; gap:6px;}
  .snapshot-col .stat{display:flex; justify-content:space-between; font-size:12px; padding:2px 0; color:var(--dim);}
  .snapshot-col .stat b{color:var(--text); font-weight:600;}
  .form-dots{display:flex; gap:3px;}
  .form-dot{width:15px; height:15px; border-radius:50%; font-size:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800;}
  .form-dot.W{background:var(--green);} .form-dot.D{background:var(--amber);} .form-dot.L{background:var(--red);}
  .h2h-box{background:var(--chip-bg); border-radius:10px; padding:9px 10px; margin-bottom:12px; font-size:12px;}
  .h2h-box .row1{display:flex; justify-content:space-between; margin-bottom:5px; color:var(--dim);}
  .h2h-box .row1 b{color:var(--text);}
  .h2h-last5{display:flex; flex-wrap:wrap; gap:5px;}
  .h2h-chip{background:var(--card); border:1px solid var(--border); border-radius:6px; padding:2px 6px; font-size:10.5px;}

  .market-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);
  }
  .market-row:last-child{border-bottom:none;}
  .market-row .label{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.03em; flex:none; width:64px; padding-top:1px;}
  .market-row .body{flex:1; min-width:0;}
  .market-row .rec{font-size:13px; font-weight:600;}
  .market-row .rec.pass{color:var(--dim); font-weight:500;}
  .market-row .stars{color:var(--star); font-size:12px; margin-left:4px;}
  .market-row .reason{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .price-move{display:flex; align-items:center; gap:5px; margin-top:4px;}
  .price-move .pm-label{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.02em;}
  .price-move .pm-val{font-size:12px; font-weight:600; font-variant-numeric:tabular-nums;}
  .price-move .pm-val.pm-up{color:var(--green);}
  .price-move .pm-val.pm-down{color:var(--red);}
  .price-move .spark{flex:none; display:block;}
  .moves-overview{background:var(--chip-bg); border-radius:10px; padding:9px 10px; margin-bottom:12px;}
  .moves-overview h4{font-size:12px; margin:0 0 6px 0; color:var(--dim); text-transform:uppercase; letter-spacing:.03em;}
  .moves-table{display:grid; grid-template-columns:auto 1fr 1fr; column-gap:8px; row-gap:4px; align-items:center;}
  .moves-table .mt-head{font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.02em;}
  .moves-table .mt-team{font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .moves-table .mt-cell{display:flex; align-items:center; gap:3px; min-width:0;}
  .moves-table .mt-cell .pm-val{font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .moves-table .mt-cell .pm-val.pm-up{color:var(--green);}
  .moves-table .mt-cell .pm-val.pm-down{color:var(--red);}
  .moves-table .mt-cell .spark{flex:none; display:block;}
  .moves-table .mt-empty{font-size:11px; color:var(--dim);}
  .moves-item{display:flex; align-items:center; gap:5px; padding:3px 0;}
  .moves-item .mi-label{font-size:10.5px; color:var(--dim); width:58px; flex:none;}
  .moves-item .pm-val{font-size:12px; font-weight:600; font-variant-numeric:tabular-nums;}
  .moves-item .pm-val.pm-up{color:var(--green);}
  .moves-item .pm-val.pm-down{color:var(--red);}
  .moves-item .spark{flex:none; display:block;}
  .moves-row{display:flex; flex-direction:column;}
  @media (min-width:480px){
    .moves-row{flex-direction:row; gap:8px;}
    .moves-row .moves-overview{flex:1 1 0; min-width:0;}
    .moves-table{grid-template-columns:40px 1fr 1fr; column-gap:4px;}
    .moves-table .mt-team{font-size:10px;}
    .moves-item{gap:3px;}
    .moves-item .mi-label{width:40px; font-size:9.5px;}
  }
  .track-btn{
    flex:none; border:1px solid var(--accent); color:var(--accent); background:none; border-radius:20px;
    font-size:11px; padding:4px 10px; cursor:pointer; font-weight:600; white-space:nowrap;
  }
  .track-btn.tracked{background:var(--accent); color:#fff;}

  .fullstats-toggle{
    width:100%; margin-top:10px; padding:9px; border-radius:9px; border:1px dashed var(--border);
    background:none; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .fullstats{display:none; margin-top:10px;}
  .fullstats.open{display:block;}
  .fs-section{margin-bottom:10px;}
  .fs-section h5{font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--dim); margin:0 0 5px 0;}
  .fs-table{width:100%; border-collapse:collapse; font-size:12px;}
  .fs-table td{padding:4px 4px; border-bottom:1px solid var(--border);}
  .fs-table td.k{color:var(--dim); width:46%;}
  .fs-table td.v{text-align:right; font-weight:600;}

  .empty{text-align:center; color:var(--dim); padding:40px 10px; font-size:13.5px;}

  /* tracker */
  .tsum{display:flex; gap:8px; margin-bottom:14px;}
  .tsum .box{flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center;}
  .tsum .box .n{font-size:18px; font-weight:800;}
  .tsum .box .l{font-size:10.5px; color:var(--dim); text-transform:uppercase;}
  .tr-filters{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px;}
  .tr-filters .tr-preset-btn{background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer;}
  .tr-filters .tr-datelabel{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--dim); background:var(--card); border:1px solid var(--border); border-radius:8px; padding:5px 8px;}
  .tr-filters .tr-datelabel input[type=date]{border:none; background:none; color:var(--text); font-size:12.5px; padding:0; max-width:112px;}
  .tr-chart-wrap{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 10px 6px 10px; margin-bottom:14px;}
  .tr-chart-svg{width:100%; height:100px; display:block;}
  .tr-chart-baseline{stroke:var(--border); stroke-width:1; stroke-dasharray:3,3;}
  .tr-chart-labels{display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim); margin-bottom:4px;}
  .tr-chart-labels .tr-chart-total{font-weight:800; color:var(--text); font-size:12px;}
  .tr-chart-empty{font-size:12.5px; color:var(--dim); text-align:center; padding:14px 0;}
  .tcard{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:9px;}
  .tcard .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .tcard .rec{font-size:13px; font-weight:600;}
  .tcard .match{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .tcard .row2{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .tcard input[type=number]{width:56px; padding:5px 6px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12.5px;}
  .status-btn{flex:1; padding:6px; border-radius:7px; border:1px solid var(--border); background:var(--chip-bg); color:var(--text); font-size:11.5px; font-weight:600; cursor:pointer;}
  .status-btn.won{background:var(--green-bg); color:var(--green); border-color:var(--green);}
  .status-btn.lost{background:var(--red-bg); color:var(--red); border-color:var(--red);}
  .status-btn.push{background:var(--amber-bg); color:var(--amber); border-color:var(--amber);}
  .remove-btn{background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:0 2px;}
  .identity-row{font-size:12px; color:var(--dim); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px;}
  .identity-row b{color:var(--text);}
  .identity-switch{background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; padding:0;}
  .tcard.readonly{opacity:.85;}
  .row2.readonly{gap:10px; font-size:12px; color:var(--dim); align-items:center;}
  .row2.readonly .ro-stake, .row2.readonly .ro-odds{font-weight:600; color:var(--text);}
  .status-chip{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; background:var(--chip-bg); color:var(--dim);}
  .status-chip.won, .status-chip.half_won{background:var(--green-bg); color:var(--green);}
  .status-chip.lost, .status-chip.half_lost{background:var(--red-bg); color:var(--red);}
  .status-chip.push{background:var(--amber-bg); color:var(--amber);}

  .footer-note{text-align:center; font-size:10.5px; color:var(--dim); padding:16px 10px 0 10px;}

  /* explicit theme choice (toggle) -- overrides both :root and prefers-color-scheme */
  :root[data-theme="light"]{
    --bg:#f4f5f7; --card:#ffffff; --text:#16181d; --dim:#6b7280; --border:#e5e7eb;
    --accent:#2563eb; --accent-dim:#dbeafe; --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2; --amber:#d97706; --amber-bg:#fef3c7;
    --star:#f59e0b; --chip-bg:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#0d1520; --text:#f2f5f9; --dim:#93a3b8; --border:#22303f;
    --accent:#6cabdd; --accent-dim:#16324f; --green:#4ade80; --green-bg:#0f2d1c;
    --red:#f87171; --red-bg:#3a1414; --amber:#fbbf24; --amber-bg:#3a2c0d;
    --star:#fbbf24; --chip-bg:#16202c; --shadow:0 1px 2px rgba(0,0,0,.6),0 1px 12px rgba(0,0,0,.5);
  }
  .theme-toggle-btn{
    position:absolute; top:9px; right:14px; background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:5px 10px; font-size:13px; line-height:1; cursor:pointer; color:var(--text);
  }
  .mcfc-crest{display:none; height:20px; width:20px; vertical-align:-5px; margin-right:5px; border-radius:50%;}
  :root[data-theme="dark"] .mcfc-crest{display:inline-block;}
</style>
</head>
<body>

<header class="top">
  <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle light/dark theme">🌙</button>
  <h1><img class="mcfc-crest" src="https://media.api-sports.io/football/teams/50.png" alt="" onerror="this.style.display='none'"> Match Day Board</h1>
  <div class="meta" id="genMeta"></div>
  <nav class="tabs">
    <button data-tab="top" class="active">Top Picks</button>
    <button data-tab="fixtures">Fixtures</button>
    <button data-tab="tracker">Tracker</button>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-top">
    <div id="topList"></div>
  </section>

  <section class="tab" id="tab-fixtures">
    <div class="filters">
      <select id="f-day"><option value="">All days</option></select>
      <button class="dropdown-btn" id="f-league-btn">League <span class="count" id="f-league-count"></span></button>
      <button class="dropdown-btn" id="f-time-btn">Kickoff <span class="count" id="f-time-count"></span></button>
      <select id="f-stars">
        <option value="0">Any stars</option>
        <option value="2">2★+</option>
        <option value="3">3★+</option>
        <option value="3.5">3.5★+</option>
        <option value="4">4★+</option>
        <option value="4.5">4.5★+</option>
      </select>
      <select id="f-market">
        <option value="">All markets</option>
        <option value="best_bet">Best Bet</option>
        <option value="match_total">Match Total</option>
        <option value="btts">BTTS</option>
        <option value="team_total">Team Total</option>
        <option value="ml">Moneyline</option>
        <option value="dc">Double Chance</option>
        <option value="ah">Asian Handicap</option>
      </select>
      <input type="search" id="f-team" placeholder="Search team name…">
    </div>
    <div id="fixtureList"></div>
  </section>

  <section class="tab" id="tab-tracker">
    <div class="tr-filters">
      <button class="tr-preset-btn" data-preset="all">All</button>
      <button class="tr-preset-btn" data-preset="7d">7D</button>
      <button class="tr-preset-btn" data-preset="30d">30D</button>
      <button class="tr-preset-btn" data-preset="month">This month</button>
      <label class="tr-datelabel">From <input type="date" id="tr-from"></label>
      <label class="tr-datelabel">To <input type="date" id="tr-to"></label>
    </div>
    <div class="tsum">
      <div class="box"><div class="n" id="tr-record">0-0-0</div><div class="l">Record</div></div>
      <div class="box"><div class="n" id="tr-hitrate">–</div><div class="l">Hit rate</div></div>
      <div class="box"><div class="n" id="tr-units">0.00</div><div class="l">Units</div></div>
    </div>
    <div class="tr-chart-wrap" id="tr-chart-wrap"></div>
    <div id="identityRow" class="identity-row"></div>
    <div id="trackerList"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="dropdown-panel" id="f-league-panel">
  <input type="search" class="search" id="league-search" placeholder="Search leagues…">
  <div class="actions">
    <button id="league-all">Select all</button>
    <button id="league-clear">Clear</button>
  </div>
  <div id="league-options"></div>
  <button class="backdrop-close" data-close>Done</button>
</div>
<div class="dropdown-panel" id="f-time-panel">
  <div class="actions">
    <button id="time-all">Select all</button>
    <button id="time-clear">Clear</button>
  </div>
  <div id="time-options"></div>
  <button class="backdrop-close" data-close>Done</button>
</div>

<script id="fixtures-data" type="application/json">__FIXTURES_JSON__</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('fixtures-data').textContent || '{"fixtures":[]}');
  var FIXTURES = DATA.fixtures || [];

  // ---- theme (light/dark toggle, localStorage, per browser; overrides system default) ----
  var THEME_KEY = 'matchDayTheme_v1';
  function loadTheme(){
    try { return localStorage.getItem(THEME_KEY) || null; } catch(e){ return null; }
  }
  function saveTheme(mode){
    try { mode ? localStorage.setItem(THEME_KEY, mode) : localStorage.removeItem(THEME_KEY); } catch(e){}
  }
  function isEffectivelyDark(mode){
    return mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function applyTheme(mode){
    if (mode === 'dark' || mode === 'light') document.documentElement.setAttribute('data-theme', mode);
    else document.documentElement.removeAttribute('data-theme');
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = isEffectivelyDark(mode) ? '☀️' : '🌙';
  }
  function toggleTheme(){
    var next = isEffectivelyDark(loadTheme()) ? 'light' : 'dark';
    saveTheme(next);
    applyTheme(next);
  }
  applyTheme(loadTheme()); // apply immediately, before first paint of the rest of the page

  // ---------- helpers ----------
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hashColor(name){
    var h = 0;
    for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    var hue = h % 360;
    return 'hsl(' + hue + ',55%,42%)';
  }
  function initials(name){
    if(!name) return '?';
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function badge(name, logoUrl, size){
    var cls = 'badge' + (size ? ' ' + size : '');
    var bg = hashColor(name||'?');
    if (logoUrl) {
      return '<span class="'+cls+'" style="background:'+bg+'"><img src="'+esc(logoUrl)+'" alt="" loading="lazy" ' +
             'onerror="this.parentElement.innerHTML=\''+esc(initials(name))+'\';this.parentElement.style.background=\''+bg+'\';"></span>';
    }
    return '<span class="'+cls+'" style="background:'+bg+'">'+esc(initials(name))+'</span>';
  }
  function fmtTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }
  function fmtDay(dateStr){
    if(!dateStr) return '';
    var d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  }
  function stars(v){
    if (v==null) return '';
    var full = Math.floor(v), half = (v - full) >= 0.5;
    return '★'.repeat(full) + (half?'½':'') + ' ('+v.toFixed(1)+')';
  }
  function formDots(form){
    if(!form) return '<span style="color:var(--dim);font-size:11px;">no data</span>';
    return form.split('').map(function(c){
      var k = c.toUpperCase();
      if (k!=='W' && k!=='D' && k!=='L') return '';
      return '<span class="form-dot '+k+'">'+k+'</span>';
    }).join('');
  }

  // ---------- market row builder ----------
  var MARKET_DEFS = [
    {key:'match_total', label:'Total', single:true},
    {key:'btts', label:'BTTS', single:true},
    {key:'team_total', label:'Team Tot', single:false},
    {key:'ml', label:'ML', single:false},
    {key:'dc', label:'DC', single:false},
    {key:'ah', label:'AH', single:false},
  ];

  // ---------- price move (open -> current, with sparkline) ----------
  function fmtAmerican(n){
    if (n == null || isNaN(n)) return '–';
    return (n > 0 ? '+' : '') + n;
  }

  function fmtLine(l){
    if (l == null || isNaN(l)) return '';
    return String(Math.round(l * 100) / 100);
  }

  function fmtLinePrice(l, o){
    return (l != null ? fmtLine(l) + ' ' : '') + fmtAmerican(o);
  }

  function sparklineSvg(hist, width){
    var vals = hist.map(function(p){ return p.o; });
    var w = width || 46, h = 16, pad = 2;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min -= 1; max += 1; }
    var n = vals.length;
    var pts = vals.map(function(v, i){
      var x = n === 1 ? w/2 : (i/(n-1)) * (w - 2*pad) + pad;
      var y = h - pad - ((v - min) / (max - min)) * (h - 2*pad);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var favorable = vals[vals.length-1] <= vals[0];
    var stroke = favorable ? 'var(--green)' : 'var(--red)';
    return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
      '<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'+
    '</svg>';
  }

  // Which fx.moves key (if any) applies to a given market row. Best Bet/DC/AH always
  // return null -- api_footbal_odds.py doesn't pull those markets, so there's never
  // real price history to show for them.
  function moveKeyFor(marketKey, side, pick){
    if (marketKey === 'match_total') return 'match_total';
    if (marketKey === 'team_total') return side === 'home' ? 'tt_home' : 'tt_away';
    if (marketKey === 'ml') return side === 'home' ? 'ml_home' : 'ml_away';
    if (marketKey === 'btts') {
      var r = ((pick && pick.rec) || '').trim().toLowerCase();
      if (r.indexOf('yes') === 0) return 'btts_yes';
      if (r.indexOf('no') === 0) return 'btts_no';
      return null;
    }
    return null;
  }

  // A market's line can move on its own (e.g. Match Total 2.5 -> 3.0) independently of
  // (or even opposite to) the price -- treat a real line move as the decisive signal,
  // same as line_steam's own open-vs-current comparison in the scoring code, and only
  // fall back to price-only when the line didn't move or the market has no line at all
  // (ML/BTTS). Otherwise a line moving toward Over/higher can still get colored "bad"
  // just because the price alone looks worse in isolation (Carlos, 2026-09-02).
  function isFavorableMove(hist){
    var openOdds = hist[0].o, currOdds = hist[hist.length-1].o;
    var openLine = hist[0].l, currLine = hist[hist.length-1].l;
    if (openLine != null && currLine != null && openLine !== currLine) return currLine > openLine;
    return currOdds <= openOdds;
  }

  function moveLineHtml(fx, marketKey, side, pick){
    var key = moveKeyFor(marketKey, side, pick);
    var hist = key && fx.moves && fx.moves[key];
    if (!hist || hist.length < 2) return '';
    var openOdds = hist[0].o, currOdds = hist[hist.length-1].o;
    var favorable = isFavorableMove(hist);
    return '<div class="price-move">'+
        '<span class="pm-label">Open</span><span class="pm-val">'+fmtAmerican(openOdds)+'</span>'+
        sparklineSvg(hist)+
        '<span class="pm-label">Now</span><span class="pm-val '+(favorable?'pm-up':'pm-down')+'">'+fmtAmerican(currOdds)+'</span>'+
      '</div>';
  }

  // ---- consolidated "Line Moves" section: every covered market's move, in one place,
  // regardless of which market the actual bet/Best Bet is on (Carlos's 2026-09-01 request).
  function movesOverviewRow(label, hist){
    if (!hist || hist.length < 2) return '';
    var openOdds = hist[0].o, currOdds = hist[hist.length-1].o;
    var openLine = hist[0].l, currLine = hist[hist.length-1].l;
    var favorable = isFavorableMove(hist);
    return '<div class="moves-item">'+
        '<span class="mi-label">'+esc(label)+'</span>'+
        '<span class="pm-val">'+fmtLinePrice(openLine, openOdds)+'</span>'+
        sparklineSvg(hist)+
        '<span class="pm-val '+(favorable?'pm-up':'pm-down')+'">'+fmtLinePrice(currLine, currOdds)+'</span>'+
      '</div>';
  }

  function movesTableCell(hist){
    if (!hist || hist.length < 2) return '<span class="mt-empty">\u2013</span>';
    var openOdds = hist[0].o, currOdds = hist[hist.length-1].o;
    var openLine = hist[0].l, currLine = hist[hist.length-1].l;
    var favorable = isFavorableMove(hist);
    return '<span class="pm-val">'+fmtLinePrice(openLine, openOdds)+'</span>'+
      sparklineSvg(hist, 32)+
      '<span class="pm-val '+(favorable?'pm-up':'pm-down')+'">'+fmtLinePrice(currLine, currOdds)+'</span>';
  }

  function movesTableRow(teamName, mlHist, ttHist){
    var hasMl = mlHist && mlHist.length >= 2;
    var hasTt = ttHist && ttHist.length >= 2;
    if (!hasMl && !hasTt) return '';
    return '<div class="mt-team">'+esc(teamName)+'</div>'+
      '<div class="mt-cell">'+movesTableCell(mlHist)+'</div>'+
      '<div class="mt-cell">'+movesTableCell(ttHist)+'</div>';
  }

  function movesOverviewHtml(fx){
    var m = fx.moves || {};
    var homeRow = movesTableRow(fx.home, m.ml_home, m.tt_home);
    var awayRow = movesTableRow(fx.away, m.ml_away, m.tt_away);
    var matchRows = movesOverviewRow('Match Total', m.match_total) + movesOverviewRow('BTTS Yes', m.btts_yes);

    var box1 = '';
    if (homeRow || awayRow) {
      box1 = '<div class="moves-overview">'+
          '<h4>ML &amp; Team Total</h4>'+
          '<div class="moves-table">'+
            '<div class="mt-head"></div><div class="mt-head">ML</div><div class="mt-head">Team Total</div>'+
            homeRow+
            awayRow+
          '</div>'+
        '</div>';
    }
    var box2 = '';
    if (matchRows) {
      box2 = '<div class="moves-overview">'+
          '<h4>Match Total &amp; BTTS</h4>'+
          matchRows+
        '</div>';
    }
    if (!box1 && !box2) return '';
    return '<div class="moves-row">'+box1+box2+'</div>';
  }

  function marketRowHtml(fx, marketKey, side, pick, label){
    var trackId = fx.id + '::' + marketKey + (side?('::'+side):'');
    var tracked = isTracked(trackId);
    var teamName = side ? (side==='home'?fx.home:fx.away) : '';
    var labelHtml = '<div class="label">'+esc(label)+(teamName?'<br><span style="opacity:.6">'+esc(teamName.split(' ')[0])+'</span>':'')+'</div>';
    if (!pick) {
      return '<div class="market-row">'+labelHtml+'<div class="body"><span class="rec pass">PASS</span></div></div>';
    }
    if (pick.stars == null) {
      // PASS, but with its explanation -- same info a real pick gets, minus stars/Track.
      return '<div class="market-row">'+labelHtml+
        '<div class="body">'+
          '<span class="rec pass">PASS</span>'+
          (pick.reason ? '<div class="reason">'+esc(pick.reason)+'</div>' : '')+
          moveLineHtml(fx, marketKey, side, pick)+
        '</div>'+
      '</div>';
    }
    return '<div class="market-row">'+labelHtml+
      '<div class="body">'+
        '<span class="rec">'+esc(pick.rec)+'</span> <span class="stars">'+esc(stars(pick.stars))+'</span>'+
        (pick.reason ? '<div class="reason">'+esc(pick.reason)+'</div>' : '')+
        moveLineHtml(fx, marketKey, side, pick)+
      '</div>'+
      '<button class="track-btn'+(tracked?' tracked':'')+'" data-track="'+esc(trackId)+'" data-fx="'+esc(fx.id)+'" data-market="'+esc(marketKey)+'" data-side="'+esc(side||'')+'">'+(tracked?'Tracked':'Track')+'</button>'+
    '</div>';
  }

  function fullStatsHtml(fx){
    if (!fx.full || !fx.full.length) return '<div style="font-size:12px;color:var(--dim);">No additional stats for this fixture.</div>';
    return fx.full.map(function(sec){
      var rows = sec.items.map(function(it){
        if (sec.kind==='match') {
          return '<tr><td class="k">'+esc(it[0])+'</td><td class="v">'+esc(it[1])+'</td></tr>';
        }
        return '<tr><td class="k">'+esc(it[0])+'</td><td class="v">'+esc(it[1]||'–')+' <span style="opacity:.5">/</span> '+esc(it[2]||'–')+'</td></tr>';
      }).join('');
      return '<div class="fs-section"><h5>'+esc(sec.title)+'</h5><table class="fs-table">'+rows+'</table></div>';
    }).join('');
  }

  function snapshotHtml(fx){
    var snap = fx.snapshot || {};
    var h = snap.home || {}, a = snap.away || {};
    function col(team, s, logo){
      return '<div class="snapshot-col">'+
        '<h4>'+badge(team, logo, 'sm')+' '+esc(team)+'</h4>'+
        '<div class="stat">Rank <b>'+(s.rank!=null?'#'+s.rank:'–')+'</b></div>'+
        '<div class="stat">Points <b>'+(s.points!=null?s.points:'–')+'</b></div>'+
        '<div class="stat">Goal diff <b>'+(s.goalDiff!=null?(s.goalDiff>0?'+':'')+s.goalDiff:'–')+'</b></div>'+
        '<div class="stat">Form</div><div class="form-dots">'+formDots(s.form)+'</div>'+
        '<div class="stat" style="margin-top:4px;">GF/GA <b>'+(s.gFor!=null?s.gFor:'–')+' / '+(s.gAgainst!=null?s.gAgainst:'–')+'</b></div>'+
        '<div class="stat">xG <b>'+(s.xg!=null?s.xg:'–')+'</b></div>'+
        '<div class="stat">Played <b>'+(s.played!=null?s.played:'–')+'</b></div>'+

    var h2h = snap.h2h || {};

      (h2h.last5 && h2h.last5.length ? '<div class="h2h-last5">'+h2h.last5.map(function(m){return '<span class="h2h-chip">'+esc(m)+'</span>';}).join('')+'</div>' : '<div style="font-size:11px;color:var(--dim);">No recent meetings on record</div>')+

  function marketsHtml(fx){
    var out = '';
    out += marketRowHtml(fx, 'best_bet', null, fx.best_bet, 'Best Bet');
    out += marketRowHtml(fx, 'match_total', null, fx.match_total, 'Total');
    out += marketRowHtml(fx, 'btts', null, fx.btts, 'BTTS');
    ['team_total','ml','dc','ah'].forEach(function(mk){
      var labelMap = {team_total:'Team Tot', ml:'ML', dc:'DC', ah:'AH'};
      var obj = fx[mk] || {};
      out += marketRowHtml(fx, mk, 'home', obj.home, labelMap[mk]);
      out += marketRowHtml(fx, mk, 'away', obj.away, labelMap[mk]);
    });
    return out;
  }

  function bestBetSummaryLine(fx){

  // ---------- Top Picks tab ----------
  function renderTop(){
    var top5 = FIXTURES.filter(function(f){ return f.top5 != null; }).sort(function(a,b){ return a.top5-b.top5; });
    var others = FIXTURES.filter(function(f){
      if (f.top5 != null) return false;
      var stars = [f.match_total, f.btts].concat(
        ['team_total','ml','dc','ah'].map(function(mk){ return (f[mk]||{}).home; }),
        ['team_total','ml','dc','ah'].map(function(mk){ return (f[mk]||{}).away; })
      ).filter(Boolean).map(function(p){ return p.stars; });
      return stars.some(function(s){ return s>=4; });
    });
    var html = '';
    if (top5.length) {
      html += '<h3 style="font-size:13px;color:var(--dim);text-transform:uppercase;margin:4px 0 8px 2px;">Today\'s Top 5</h3>';
      html += top5.map(function(f){ return cardHtml(f); }).join('');
    }
    if (others.length) {
      html += '<h3 style="font-size:13px;color:var(--dim);text-transform:uppercase;margin:16px 0 8px 2px;">Other 4★+ picks</h3>';
      html += others.map(function(f){ return cardHtml(f); }).join('');
    }
    if (!html) html = '<div class="empty">No standout picks in the current window.</div>';
    document.getElementById('topList').innerHTML = html;
  }

  // ---------- Fixtures tab / filters ----------
  var leagueSet = [], timeSet = [];
  var leagueSelected = new Set(), timeSelected = new Set();

  function buildFilterOptions(){
    var days = Array.from(new Set(FIXTURES.map(function(f){return f.date;}))).filter(Boolean).sort();
    var daySel = document.getElementById('f-day');
    days.forEach(function(d){
      var o = document.createElement('option'); o.value = d; o.textContent = fmtDay(d); daySel.appendChild(o);
    });
    leagueSet = Array.from(new Set(FIXTURES.map(function(f){return f.league;}))).filter(Boolean).sort();
    timeSet = Array.from(new Set(FIXTURES.map(function(f){return fmtTime(f.ts);}))).filter(Boolean).sort(function(a,b){
      // sort chronologically by parsing back to minutes-ish via Date on arbitrary day
      function toMinutes(t){
        var m = t.match(/(\d+):(\d+)\s*([AP]M)/i);
        if(!m) return 0;
        var h = parseInt(m[1],10)%12; if(/pm/i.test(m[3])) h+=12;
        return h*60+parseInt(m[2],10);
      }
      return toMinutes(a)-toMinutes(b);
    });
    leagueSelected = new Set(leagueSet);
    timeSelected = new Set(timeSet);
    renderLeagueOptions('');
    renderTimeOptions();
    updateDropdownCounts();
  }

  function renderLeagueOptions(filterText){
    var box = document.getElementById('league-options');
    var ft = (filterText||'').toLowerCase();
    box.innerHTML = leagueSet.filter(function(l){ return l.toLowerCase().indexOf(ft) !== -1; }).map(function(l){
      var checked = leagueSelected.has(l) ? 'checked' : '';
      return '<label><input type="checkbox" value="'+esc(l)+'" '+checked+' class="league-cb"> '+esc(l)+'</label>';
    }).join('');
    box.querySelectorAll('.league-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        if (cb.checked) leagueSelected.add(cb.value); else leagueSelected.delete(cb.value);
        updateDropdownCounts(); renderFixtures();
      });
    });
  }
  function renderTimeOptions(){
    var box = document.getElementById('time-options');
    box.innerHTML = timeSet.map(function(t){
      var checked = timeSelected.has(t) ? 'checked' : '';
      return '<label><input type="checkbox" value="'+esc(t)+'" '+checked+' class="time-cb"> '+esc(t)+'</label>';
    }).join('');
    box.querySelectorAll('.time-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        if (cb.checked) timeSelected.add(cb.value); else timeSelected.delete(cb.value);
        updateDropdownCounts(); renderFixtures();
      });
    });
  }
  function updateDropdownCounts(){
    var lc = document.getElementById('f-league-count');
    var tc = document.getElementById('f-time-count');
    lc.textContent = (leagueSelected.size && leagueSelected.size < leagueSet.length) ? '('+leagueSelected.size+')' : '';
    tc.textContent = (timeSelected.size && timeSelected.size < timeSet.length) ? '('+timeSelected.size+')' : '';
  }

  function openPanel(panel){
    document.getElementById('scrim').classList.add('open');
    panel.classList.add('open');
    var r = panel.getBoundingClientRect();
    if (window.innerHeight - 80 < 200) { /* noop, css handles via viewport */ }
    panel.style.top = '90px';
  }
  function closeAllPanels(){
    document.querySelectorAll('.dropdown-panel').forEach(function(p){ p.classList.remove('open'); });
    document.getElementById('scrim').classList.remove('open');
  }

  // ---------- filter persistence (localStorage, per browser) ----------
  var FILTER_KEY = 'matchDayFilters_v1';
  function saveFilterState(){
    try {
      localStorage.setItem(FILTER_KEY, JSON.stringify({
        day: document.getElementById('f-day').value,
        stars: document.getElementById('f-stars').value,
        market: document.getElementById('f-market').value,
        team: document.getElementById('f-team').value,
        league: (leagueSelected.size === leagueSet.length) ? 'ALL' : Array.from(leagueSelected),
        time: (timeSelected.size === timeSet.length) ? 'ALL' : Array.from(timeSelected)
      }));
    } catch(e){}
  }
  function loadFilterState(){
    try { return JSON.parse(localStorage.getItem(FILTER_KEY) || 'null'); } catch(e){ return null; }
  }
  function restoreFilterState(){
    var saved = loadFilterState();
    if (!saved) return;
    var daySel = document.getElementById('f-day');
    if (saved.day && Array.from(daySel.options).some(function(o){ return o.value===saved.day; })) daySel.value = saved.day;
    var starsSel = document.getElementById('f-stars');
    if (saved.stars != null && Array.from(starsSel.options).some(function(o){ return o.value===saved.stars; })) starsSel.value = saved.stars;
    var marketSel = document.getElementById('f-market');
    if (saved.market != null && Array.from(marketSel.options).some(function(o){ return o.value===saved.market; })) marketSel.value = saved.market;
    if (saved.team != null) document.getElementById('f-team').value = saved.team;
    if (saved.league && saved.league !== 'ALL') {
      var restoredLeagues = saved.league.filter(function(l){ return leagueSet.indexOf(l) !== -1; });
      if (restoredLeagues.length) leagueSelected = new Set(restoredLeagues);
    }
    if (saved.time && saved.time !== 'ALL') {
      var restoredTimes = saved.time.filter(function(t){ return timeSet.indexOf(t) !== -1; });
      if (restoredTimes.length) timeSelected = new Set(restoredTimes);
    }
    renderLeagueOptions('');
    renderTimeOptions();
    updateDropdownCounts();
  }

  function passesFilters(fx){
    var day = document.getElementById('f-day').value;
    if (day && fx.date !== day) return false;
    if (leagueSelected.size && !leagueSelected.has(fx.league)) return false;
    if (timeSelected.size && !timeSelected.has(fmtTime(fx.ts))) return false;
    var minStars = parseFloat(document.getElementById('f-stars').value || '0');
    var marketFilter = document.getElementById('f-market').value;
    var teamQ = document.getElementById('f-team').value.trim().toLowerCase();
    if (teamQ) {
      var hay = (fx.home + ' ' + fx.away).toLowerCase();
      if (hay.indexOf(teamQ) === -1) return false;
    }
    if (minStars > 0 || marketFilter) {
      var picks = [];
      if (!marketFilter || marketFilter==='best_bet') picks.push(fx.best_bet);
      if (!marketFilter || marketFilter==='match_total') picks.push(fx.match_total);
      if (!marketFilter || marketFilter==='btts') picks.push(fx.btts);
      ['team_total','ml','dc','ah'].forEach(function(mk){
        if (!marketFilter || marketFilter===mk) {
          picks.push((fx[mk]||{}).home);
          picks.push((fx[mk]||{}).away);
        }
      });
      picks = picks.filter(function(p){ return p && p.stars != null; });
      if (!picks.length) return false;
      if (minStars > 0 && (!fx.best_bet || fx.best_bet.stars < minStars)) return false;
    }
    return true;
  }

  // ---------- tracker (Google Sheets sync via Apps Script, localStorage cache) ----------
  var TRACK_KEY = 'matchDayTrackerCache_v1'; // last-synced picks (all users) -- offline fallback + instant paint
  var IDENTITY_KEY = 'matchDayIdentity_v1';
  var TRACKER_SYNC_URL = 'https://script.google.com/macros/s/AKfycbwGW4m2xudKSRI-lWyJboaEKwMG2OGycICAh2YoHFQBB-LbyaE9jETwBeOSypbtroUt/exec';
  var STATUS_LABELS = {pending:'Pending', won:'Won', half_won:'½ Won', push:'Push', half_lost:'½ Lost', lost:'Lost'};

  // ---- tracker date-range filter (localStorage, per browser) ----
  var TR_FILTER_KEY = 'matchDayTrackerFilters_v1';
  function saveTrackerFilterState(){
    try {
      localStorage.setItem(TR_FILTER_KEY, JSON.stringify({
        from: document.getElementById('tr-from').value,
        to: document.getElementById('tr-to').value
      }));
    } catch(e){}
  }
  function loadTrackerFilterState(){
    try { return JSON.parse(localStorage.getItem(TR_FILTER_KEY) || 'null'); } catch(e){ return null; }
  }
  function restoreTrackerFilterState(){
    var saved = loadTrackerFilterState();
    if (!saved) return;
    if (saved.from) document.getElementById('tr-from').value = saved.from;
    if (saved.to) document.getElementById('tr-to').value = saved.to;
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function dateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function todayStr(){ return dateStr(new Date()); }
  function addDaysStr(baseStr, days){
    var d = new Date(baseStr+'T12:00:00');
    d.setDate(d.getDate()+days);
    return dateStr(d);
  }
  function applyTrackerPreset(name){
    var today = todayStr();
    var from = '', to = '';
    if (name === '7d') { from = addDaysStr(today, -6); to = today; }
    else if (name === '30d') { from = addDaysStr(today, -29); to = today; }
    else if (name === 'month') { from = today.slice(0,8)+'01'; to = today; }
    document.getElementById('tr-from').value = from;
    document.getElementById('tr-to').value = to;
    saveTrackerFilterState();
    renderTracker();
  }

  function getIdentity(){
    try { return JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null'); } catch(e){ return null; }
  }
  function setIdentity(name, pin){
    try { localStorage.setItem(IDENTITY_KEY, JSON.stringify({name:name, pin:pin})); } catch(e){}
  }
  function clearIdentity(){
    try { localStorage.removeItem(IDENTITY_KEY); } catch(e){}
  }
  function ensureIdentity(){
    var id = getIdentity();
    if (id && id.name && id.pin) return id;
    var name = window.prompt('Your name (as set up in the Users sheet):');
    if (!name) return null;
    var pin = window.prompt('Your PIN:');
    if (!pin) return null;
    setIdentity(name.trim(), pin.trim());
    return getIdentity();
  }

  function loadTracked(){
    try { return JSON.parse(localStorage.getItem(TRACK_KEY) || '[]'); } catch(e){ return []; }
  }
  function saveTracked(arr){
    try { localStorage.setItem(TRACK_KEY, JSON.stringify(arr)); } catch(e){}
  }
  function isTracked(baseTrackId){
    var id = getIdentity();
    if (!id) return false;
    var scoped = id.name + '::' + baseTrackId;
    return loadTracked().some(function(t){ return t.trackId === scoped; });
  }
  function baseIdFromScoped(scopedId){
    return String(scopedId).split('::').slice(1).join('::');
  }
  function findFixture(id){ return FIXTURES.filter(function(f){ return f.id===id; })[0]; }
  function pickFor(fx, marketKey, side){
    if (marketKey==='best_bet') return fx.best_bet;
    if (marketKey==='match_total') return fx.match_total;
    if (marketKey==='btts') return fx.btts;
    return (fx[marketKey]||{})[side];
  }
  function syncTrackButtons(trackId, tracked){
    // A fixture can render in both the Top Picks tab and the Fixtures tab at once, each
    // with its own copy of this button -- update every matching one in place rather than
    // re-rendering the fixture lists, which would collapse any currently-open expand panel.
    document.querySelectorAll('[data-track="'+trackId+'"]').forEach(function(b){
      b.textContent = tracked ? 'Tracked' : 'Track';
      b.classList.toggle('tracked', tracked);
    });
  }
  function resyncAllTrackButtons(){
    document.querySelectorAll('[data-track]').forEach(function(b){
      var baseId = b.getAttribute('data-track');
      syncTrackButtons(baseId, isTracked(baseId));
    });
  }

  // ---- server row <-> local entry shape ----
  function serverRowToEntry(row){
    return {
      trackId: row.track_id, name: row.name, fxId: row.fx_id, marketKey: row.market_key, side: row.side || '',
      matchLabel: row.match_label, league: row.league, date: row.date, rec: row.rec,
      stars: (row.stars===''||row.stars==null) ? null : parseFloat(row.stars),
      odds: (row.odds===''||row.odds==null) ? null : parseFloat(row.odds),
      stake: (row.stake===''||row.stake==null) ? 0 : parseFloat(row.stake),
      status: row.status || 'pending',
      addedAt: row.added_at ? (Number(row.added_at) || row.added_at) : Date.now()
    };
  }
  function entryToServerPick(entry){
    return {
      track_id: entry.trackId, name: entry.name, fx_id: entry.fxId, market_key: entry.marketKey, side: entry.side||'',
      match_label: entry.matchLabel, league: entry.league, date: entry.date, rec: entry.rec,
      stars: entry.stars, odds: entry.odds, stake: entry.stake, status: entry.status,
      added_at: entry.addedAt, updated_at: Date.now()
    };
  }

  // No custom headers on the POST, on purpose: fetch() then defaults the body's
  // Content-Type to text/plain, which keeps this a CORS "simple request" (no preflight).
  // Apps Script web apps don't answer OPTIONS preflights, so a JSON content-type here
  // would break cross-origin POSTs entirely. doPost() on the other end JSON.parses the
  // raw body regardless of what Content-Type it arrives with.
  function postToServer(body){
    return fetch(TRACKER_SYNC_URL, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  function syncFromServer(){
    return fetch(TRACKER_SYNC_URL).then(function(r){ return r.json(); }).then(function(data){
      if (!data || !data.ok || !Array.isArray(data.picks)) return;
      saveTracked(data.picks.map(serverRowToEntry));
      renderTracker();
      resyncAllTrackButtons();
    }).catch(function(){ /* offline or unreachable -- keep showing the last-synced cache */ });
  }

  function toggleTrack(btn){
    var baseTrackId = btn.getAttribute('data-track');
    var fxId = btn.getAttribute('data-fx');
    var marketKey = btn.getAttribute('data-market');
    var side = btn.getAttribute('data-side');
    var identity = ensureIdentity();
    if (!identity) return;
    var scopedId = identity.name + '::' + baseTrackId;
    var arr = loadTracked();
    var idx = arr.findIndex(function(t){ return t.trackId===scopedId; });
    if (idx !== -1) {
      var removed = arr[idx];
      arr.splice(idx,1);
      saveTracked(arr);
      syncTrackButtons(baseTrackId, false);
      renderTracker();
      var revert = function(){
        var arr2 = loadTracked(); arr2.push(removed); saveTracked(arr2);
        syncTrackButtons(baseTrackId, true); renderTracker();
      };
      postToServer({action:'delete', name:identity.name, pin:identity.pin, trackId: scopedId}).then(function(res){
        if (!res || !res.ok) { revert(); alert('Could not remove: ' + ((res&&res.error)||'server error')); }
      }).catch(function(){ revert(); alert('Could not reach the tracker sheet -- change not saved.'); });
    } else {
      var fx = findFixture(fxId);
      var pick = pickFor(fx, marketKey, side);
      if (!fx || !pick) return;
      var trackOdds = parseAmericanOdds(pick.rec);
      var defaultStake = stakeForWin1(trackOdds);
      var entry = {
        trackId: scopedId, name: identity.name, fxId: fxId, marketKey: marketKey, side: side,
        matchLabel: fx.home + ' vs ' + fx.away, league: fx.league, date: fx.date,
        rec: pick.rec, stars: pick.stars, odds: trackOdds, stake: defaultStake, status: 'pending', addedAt: Date.now()
      };
      arr.push(entry);
      saveTracked(arr);
      syncTrackButtons(baseTrackId, true);
      renderTracker();
      var revertAdd = function(){
        var arr2 = loadTracked().filter(function(t){ return t.trackId !== scopedId; });
        saveTracked(arr2); syncTrackButtons(baseTrackId, false); renderTracker();
      };
      postToServer({action:'upsert', name:identity.name, pin:identity.pin, pick: entryToServerPick(entry)}).then(function(res){
        if (!res || !res.ok) { revertAdd(); alert('Could not save: ' + ((res&&res.error)||'server error')); }
      }).catch(function(){ revertAdd(); alert('Could not reach the tracker sheet -- check your connection and try again.'); });
    }
  }
  function parseAmericanOdds(rec){
    var m = rec && rec.match(/\(([+-]\d+)\)/);
    if (!m) return null;
    return parseInt(m[1], 10);
  }
  function stakeForWin1(odds){
    return (odds == null || isNaN(odds)) ? 1 :
      Math.round((odds > 0 ? (100/odds) : (Math.abs(odds)/100)) * 100) / 100;
  }
  function profitFor(entry){
    if (entry.status==='pending' || entry.status==='push') return 0;
    var odds = (entry.odds!=null && entry.odds!=='') ? parseFloat(entry.odds) : parseAmericanOdds(entry.rec);
    if (isNaN(odds)) odds = null;
    var stake = parseFloat(entry.stake) || 0;
    var fullWinProfit = odds==null ? stake : (odds > 0 ? stake * (odds/100) : stake / (Math.abs(odds)/100));
    if (entry.status==='lost') return -stake;
    if (entry.status==='half_lost') return -stake / 2; // AH: half stake pushes, half loses
    if (entry.status==='half_won') return fullWinProfit / 2; // AH: half stake pushes, half wins
    return fullWinProfit; // won
  }

  function renderTrackerChart(entries){
    var wrap = document.getElementById('tr-chart-wrap');
    if (!wrap) return;
    var settled = entries.filter(function(e){ return e.status && e.status !== 'pending'; });
    if (!settled.length) {
      wrap.innerHTML = '<div class="tr-chart-empty">No settled bets in this period.</div>';
      return;
    }
    var byDate = {};
    settled.forEach(function(e){
      var d = e.date || '';
      if (!d) return;
      byDate[d] = (byDate[d] || 0) + profitFor(e);
    });
    var dates = Object.keys(byDate).sort();
    if (!dates.length) {
      wrap.innerHTML = '<div class="tr-chart-empty">No settled bets in this period.</div>';
      return;
    }
    var cum = 0;
    var pts = dates.map(function(d){ cum += byDate[d]; return {date: d, val: cum}; });
    if (pts.length === 1) {
      var v = pts[0].val;
      wrap.innerHTML = '<div class="tr-chart-empty">'+esc(fmtDay(pts[0].date))+': '+(v>=0?'+':'')+v.toFixed(2)+'u (only one day of activity)</div>';
      return;
    }
    var W = 300, H = 100, padL = 4, padR = 4, padT = 8, padB = 8;
    var minTs = new Date(pts[0].date+'T12:00:00').getTime();
    var maxTs = new Date(pts[pts.length-1].date+'T12:00:00').getTime();
    var xSpan = Math.max(1, maxTs - minTs);
    var vals = pts.map(function(p){ return p.val; });
    var minV = Math.min(0, Math.min.apply(null, vals));
    var maxV = Math.max(0, Math.max.apply(null, vals));
    if (minV === maxV) { minV -= 1; maxV += 1; }
    var padV = (maxV - minV) * 0.1;
    minV -= padV; maxV += padV;
    function xPos(p){ var ts = new Date(p.date+'T12:00:00').getTime(); return padL + (ts - minTs) / xSpan * (W - padL - padR); }
    function yPos(v){ return padT + (1 - (v - minV) / (maxV - minV)) * (H - padT - padB); }
    var y0 = yPos(0);
    var linePts = pts.map(function(p){ return xPos(p)+','+yPos(p.val); }).join(' ');
    var lastVal = pts[pts.length-1].val;
    var lineColor = lastVal >= 0 ? 'var(--green)' : 'var(--red)';
    var areaPath = 'M'+xPos(pts[0])+','+y0+' L'+pts.map(function(p){return xPos(p)+','+yPos(p.val);}).join(' L')+' L'+xPos(pts[pts.length-1])+','+y0+' Z';
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="tr-chart-svg">'+
      '<line x1="'+padL+'" y1="'+y0+'" x2="'+(W-padR)+'" y2="'+y0+'" class="tr-chart-baseline"/>'+
      '<path d="'+areaPath+'" fill="'+lineColor+'" opacity="0.15" stroke="none"/>'+
      '<polyline points="'+linePts+'" fill="none" stroke="'+lineColor+'" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      '</svg>';
    wrap.innerHTML = '<div class="tr-chart-labels"><span>'+esc(fmtDay(pts[0].date))+'</span><span class="tr-chart-total">'+(lastVal>=0?'+':'')+lastVal.toFixed(2)+'u</span><span>'+esc(fmtDay(pts[pts.length-1].date))+'</span></div>'+svg;
  }

  // ---- edits to an already-tracked pick: optimistic local update, push to server, revert on failure ----
  function pushEntryUpdate(entry, revertFn){
    var identity = getIdentity();
    if (!identity) { revertFn(); alert('Sign in first (tap "Sign in" above the tracker list).'); return; }
    postToServer({action:'upsert', name:identity.name, pin:identity.pin, pick: entryToServerPick(entry)}).then(function(res){
      if (!res || !res.ok) { revertFn(); alert('Could not save: ' + ((res&&res.error)||'server error')); }
    }).catch(function(){ revertFn(); alert('Could not reach the tracker sheet -- change not saved.'); });
  }
  function updateStake(trackId, rawValue){
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===trackId; });
    if (!e) return;
    var prev = e.stake;
    e.stake = parseFloat(rawValue)||0;
    saveTracked(arr); renderTracker();
    pushEntryUpdate(e, function(){ e.stake = prev; saveTracked(arr); renderTracker(); });
  }
  function updateOdds(trackId, rawValue){
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===trackId; });
    if (!e) return;
    var prevOdds = e.odds, prevStake = e.stake;
    var v = String(rawValue).trim();
    e.odds = v === '' ? null : parseFloat(v);
    e.stake = stakeForWin1(e.odds); // re-size to win 1 unit at the odds you actually got
    saveTracked(arr); renderTracker();
    pushEntryUpdate(e, function(){ e.odds = prevOdds; e.stake = prevStake; saveTracked(arr); renderTracker(); });
  }
  function updateStatus(trackId, status){
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===trackId; });
    if (!e) return;
    var prev = e.status;
    e.status = (e.status === status) ? 'pending' : status;
    saveTracked(arr); renderTracker();
    pushEntryUpdate(e, function(){ e.status = prev; saveTracked(arr); renderTracker(); });
  }
  function removeTracked(trackId){
    var arr = loadTracked();
    var idx = arr.findIndex(function(x){ return x.trackId===trackId; });
    if (idx === -1) return;
    var removed = arr[idx];
    var baseTrackId = baseIdFromScoped(trackId);
    arr.splice(idx,1);
    saveTracked(arr); renderTracker(); syncTrackButtons(baseTrackId, false);
    var identity = getIdentity();
    var revert = function(){
      var arr2 = loadTracked(); arr2.push(removed); saveTracked(arr2);
      renderTracker(); syncTrackButtons(baseTrackId, true);
    };
    if (!identity) { revert(); alert('Sign in first (tap "Sign in" above the tracker list).'); return; }
    postToServer({action:'delete', name:identity.name, pin:identity.pin, trackId: trackId}).then(function(res){
      if (!res || !res.ok) { revert(); alert('Could not remove: ' + ((res&&res.error)||'server error')); }
    }).catch(function(){ revert(); alert('Could not reach the tracker sheet -- change not saved.'); });
  }

  function renderIdentityRow(){
    var row = document.getElementById('identityRow');
    if (!row) return;
    var identity = getIdentity();
    row.innerHTML = identity
      ? 'Signed in as <b>'+esc(identity.name)+'</b><button class="identity-switch" id="identitySwitchBtn">Switch</button>'
      : '<span>Not signed in</span><button class="identity-switch" id="identitySwitchBtn">Sign in</button>';
    var btn = document.getElementById('identitySwitchBtn');
    if (btn) btn.addEventListener('click', function(){
      clearIdentity();
      var id = ensureIdentity();
      renderTracker();
      resyncAllTrackButtons();
      if (id) syncFromServer();
    });
  }

  function renderTracker(){
    renderIdentityRow();
    var identity = getIdentity();
    var fromVal = document.getElementById('tr-from') ? document.getElementById('tr-from').value : '';
    var toVal = document.getElementById('tr-to') ? document.getElementById('tr-to').value : '';
    var arr = loadTracked().filter(function(e){
      if (fromVal && e.date && e.date < fromVal) return false;
      if (toVal && e.date && e.date > toVal) return false;
      return true;
    }).sort(function(a,b){ return b.addedAt-a.addedAt; });
    var w=0,l=0,p=0, units=0;
    function fmtRec(n){ return (n % 1 === 0) ? String(n) : n.toFixed(1); }
    arr.forEach(function(e){
      if (e.status==='won') w+=1;
      else if (e.status==='half_won') w+=0.5;
      else if (e.status==='lost') l+=1;
      else if (e.status==='half_lost') l+=0.5;
      else if (e.status==='push') p+=1;
      units += profitFor(e);
    });
    document.getElementById('tr-record').textContent = fmtRec(w)+'-'+fmtRec(l)+'-'+fmtRec(p);
    var decided = w+l;
    document.getElementById('tr-hitrate').textContent = decided ? Math.round(100*w/decided)+'%' : '–';
    document.getElementById('tr-units').textContent = (units>=0?'+':'') + units.toFixed(2);

    document.getElementById('trackerList').innerHTML = arr.length ? arr.map(function(e){
      var mine = !!(identity && e.name === identity.name);
      var head = '<div class="top"><div><div class="rec">'+esc(e.rec)+'</div><div class="match">'+esc(e.matchLabel)+' · '+esc(e.league)+' · '+esc(fmtDay(e.date))+' · '+esc(e.name||'?')+'</div></div>'+
        (mine ? '<button class="remove-btn" data-remove="'+esc(e.trackId)+'">✕</button>' : '')+
      '</div>';
      if (!mine) {
        return '<div class="tcard readonly" data-trackid="'+esc(e.trackId)+'">'+head+
          '<div class="row2 readonly">'+
            '<span class="ro-odds">'+esc(e.odds!=null?fmtAmerican(e.odds):'–')+'</span>'+
            '<span class="ro-stake">'+esc(e.stake)+'u</span>'+
            '<span class="status-chip '+esc(e.status)+'">'+esc(STATUS_LABELS[e.status]||e.status)+'</span>'+
          '</div>'+
        '</div>';
      }
      return '<div class="tcard" data-trackid="'+esc(e.trackId)+'">'+head+
        '<div class="row2">'+
          'Odds <input type="number" step="1" value="'+esc(e.odds!=null?e.odds:'')+'" data-odds="'+esc(e.trackId)+'" title="Type the odds you actually got at your sportsbook">'+
          'Stake <input type="number" min="0" step="0.25" value="'+esc(e.stake)+'" data-stake="'+esc(e.trackId)+'">'+
          '<button class="status-btn'+(e.status==='won'?' won':'')+'" data-status="won" data-id="'+esc(e.trackId)+'">Won</button>'+
          '<button class="status-btn'+(e.status==='half_won'?' won':'')+'" data-status="half_won" data-id="'+esc(e.trackId)+'">½ Won</button>'+
          '<button class="status-btn'+(e.status==='push'?' push':'')+'" data-status="push" data-id="'+esc(e.trackId)+'">Push</button>'+
          '<button class="status-btn'+(e.status==='half_lost'?' lost':'')+'" data-status="half_lost" data-id="'+esc(e.trackId)+'">½ Lost</button>'+
          '<button class="status-btn'+(e.status==='lost'?' lost':'')+'" data-status="lost" data-id="'+esc(e.trackId)+'">Lost</button>'+
        '</div>'+
      '</div>';
    }).join('') : '<div class="empty">No tracked bets yet. Tap a pick in Top Picks or Fixtures and hit "Track".</div>';

    document.querySelectorAll('[data-stake]').forEach(function(inp){
      inp.addEventListener('change', function(){ updateStake(inp.getAttribute('data-stake'), inp.value); });
    });
    document.querySelectorAll('[data-odds]').forEach(function(inp){
      inp.addEventListener('change', function(){ updateOdds(inp.getAttribute('data-odds'), inp.value); });
    });
    document.querySelectorAll('[data-status]').forEach(function(btn){
      btn.addEventListener('click', function(){ updateStatus(btn.getAttribute('data-id'), btn.getAttribute('data-status')); });
    });
    document.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){ removeTracked(btn.getAttribute('data-remove')); });
    });
    renderTrackerChart(arr);
  }

  document.querySelectorAll('.tr-preset-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ applyTrackerPreset(btn.getAttribute('data-preset')); });
  });
  document.getElementById('tr-from').addEventListener('change', function(){ saveTrackerFilterState(); renderTracker(); });
  document.getElementById('tr-to').addEventListener('change', function(){ saveTrackerFilterState(); renderTracker(); });
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  // ---------- init ----------
  var gen = DATA.generatedAt ? new Date(DATA.generatedAt) : null;
  document.getElementById('genMeta').textContent = gen ? ('Updated ' + gen.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})) : '';
  buildFilterOptions();
  restoreFilterState();
  restoreTrackerFilterState();
  renderTop();
  renderFixtures();
  renderTracker();
  syncFromServer();
})();
</script>
</body>
</html>
